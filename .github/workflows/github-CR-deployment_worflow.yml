name: Deploy to VPS via GitHub CR

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The actor is whoever triggers the workflow (user, bot, PR merger)
          username: ${{ github.actor }}
          # automatically generated token that belongs to the workflow & has permissions to write to ghcr
          # check: Settings → Actions → General → Workflow permissions → “Read and write permissions”
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/softwareengg-app:latest .

      - name: Run tests
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/softwareengg-app:latest pytest

      - name: Push image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/softwareengg-app:latest

      # Option 1: Github automatically deploys by pushing image to VPS (requires setting up a SSH key to VPS) 
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/ocker/SoftwareEngg_project
            docker compose pull
            docker compose up -d --force-recreate
            # docker image prune -f

      # Option 2: WatchTower container monitors GHCR and pulls new images (credentials remains within VPS)
      # Very simple, just uncomment service in the docker-compose.yml 
