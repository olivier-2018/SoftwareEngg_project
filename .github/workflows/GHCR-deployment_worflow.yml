name: Deploy to GHCR

on:
  push:
    branches: [ "main", "dev", "development", "feature/**" ]

jobs:
  build-dev:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The actor is whoever triggers the workflow (user, bot, PR merger)
          username: ${{ github.actor }}
          # automatically generated token that belongs to the workflow & has permissions to write to ghcr
          # check: Settings → Actions → General → Workflow permissions → "Read and write permissions"
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (dev)
        run: |
          docker build --build-arg FLASK_ENV=development -t ghcr.io/${{ github.repository_owner }}/softwareengg-app:dev .

      - name: Run tests
        run: |
          docker run --rm \
            --env FLASK_ENV=development \
            --env FLASK_DEBUG=1 \
            --env FLASK_APP=run.py \
            --env FLASK_RUN_PORT=5003 \
            --env SECRET_KEY=dev-ci-secret-key \
            ghcr.io/${{ github.repository_owner }}/softwareengg-app:dev pytest -vrxXs

      - name: Push image to GHCR (dev)
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/softwareengg-app:dev

  build-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The actor is whoever triggers the workflow (user, bot, PR merger)
          username: ${{ github.actor }}
          # automatically generated token that belongs to the workflow & has permissions to write to ghcr
          # check: Settings → Actions → General → Workflow permissions → "Read and write permissions"
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (prod)
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/softwareengg-app:prod .

      - name: Push image to GHCR (prod)
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/softwareengg-app:prod

      # Option 1: Github automatically deploys by pushing image to VPS (requires setting up a SSH key to VPS)
